{% extends 'core/base.html' %}

{% block title %}Server Error (500) | FreelanceHub{% endblock %}

{% block content %}
<div class="container" style="max-width: 520px; padding-top: 60px;">
    <div class="card" style="padding: 40px; text-align: center;">
        <div style="font-size: 5rem; font-weight: 800; color: var(--error); font-family: var(--font-outfit); line-height: 1; margin-bottom: 16px;">500</div>
        <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 12px; font-family: var(--font-outfit);">Internal Server Error</h1>
        <p style="color: var(--text-secondary); margin-bottom: 24px; font-size: 0.95rem;">An unexpected server error occurred. Our engineering team has been notified. Please try refreshing or return home.</p>
        <a href="{% url 'home' %}" class="btn-primary" style="display: inline-flex; width: auto; padding: 12px 24px;">
            <i class="fa-solid fa-house"></i> Return to Explore Talent
        </a>
    </div>
</div>
{% endblock %}
