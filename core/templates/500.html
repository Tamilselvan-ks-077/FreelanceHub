{% extends 'core/base.html' %}

{% block title %}Server Error (500) | FreelanceHub{% endblock %}

{% block content %}
<div class="auth-container animate-fade-in" style="max-width: 500px; width: 100%; margin: 60px auto;">
    <div class="glass-panel" style="padding: 40px; text-align: center; border-radius: 20px;">
        <div style="font-size: 5rem; font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; font-family: var(--font-outfit);">500</div>
        <h1 style="font-size: 1.8rem; font-weight: 700; margin-bottom: 15px; font-family: var(--font-outfit);">Internal Server Error</h1>
        <p class="muted-text" style="margin-bottom: 30px;">Something went wrong on our servers. We have been notified and are looking into it. Please try again shortly.</p>
        <a href="{% url 'home' %}" class="btn-primary" style="display: inline-flex; align-items: center; gap: 10px; font-weight: 600; padding: 12px 24px; border-radius: 10px;">
            <i class="fa-solid fa-house"></i> Return to Explore
        </a>
    </div>
</div>
{% endblock %}
