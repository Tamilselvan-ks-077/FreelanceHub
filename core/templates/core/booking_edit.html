{% extends "core/base.html" %}

{% block title %}Edit Booking Request | FreelanceHub{% endblock %}

{% block content %}
<div class="container-sm animate-fade-in">
    <div class="card p-7">
        <div class="mb-6">
            <h1 class="text-h1 mb-1"><i class="fa-solid fa-pen-to-square text-accent"></i> Edit Booking Request</h1>
            <p class="text-secondary">Update project dates and task description for Booking #{{ booking.id }}</p>
        </div>
        
        <form method="POST" action="{% url 'booking_edit' booking.id %}">
            {% csrf_token %}
            
            <div class="grid-2">
                <div class="form-field">
                    <label for="start_date">Start Date</label>
                    <input type="date" name="start_date" id="start_date" value="{{ booking.start_date|date:'Y-m-d' }}" required>
                </div>
                
                <div class="form-field">
                    <label for="end_date">End Date</label>
                    <input type="date" name="end_date" id="end_date" value="{{ booking.end_date|date:'Y-m-d' }}" required>
                </div>
            </div>
            
            <div class="form-field">
                <label for="description">Task Description</label>
                <textarea name="description" id="description" rows="4" required>{{ booking.description }}</textarea>
            </div>
            
            <button type="submit" class="btn-primary mb-3"><i class="fa-solid fa-floppy-disk"></i> Update Request</button>
            <a href="{% url 'dashboard' %}" class="btn-secondary-link m-0">Back to Dashboard</a>
        </form>
    </div>
</div>
{% endblock %}
