{% extends 'core/base.html' %}

{% block title %}Page Not Found (404) | FreelanceHub{% endblock %}

{% block content %}
<div class="container" style="max-width: 520px; padding-top: 60px;">
    <div class="card" style="padding: 40px; text-align: center;">
        <div style="font-size: 5rem; font-weight: 800; background: var(--brand-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-family: var(--font-outfit); line-height: 1; margin-bottom: 16px;">404</div>
        <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 12px; font-family: var(--font-outfit);">Page Not Found</h1>
        <p style="color: var(--text-secondary); margin-bottom: 24px; font-size: 0.95rem;">The requested page could not be located or has been moved. Explore top freelancers from the marketplace directory.</p>
        <a href="{% url 'home' %}" class="btn-primary" style="display: inline-flex; width: auto; padding: 12px 24px;">
            <i class="fa-solid fa-house"></i> Return to Explore Talent
        </a>
    </div>
</div>
{% endblock %}
